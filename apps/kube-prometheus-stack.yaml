# Prometheus, Alertmanager and Grafana. Component with CRDs: deliberately NO resources-finalizer —
# deleting this file leaves the CRDs and every PrometheusRule/ServiceMonitor of other apps in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kube-prometheus-stack # release name: object names are prefixed with it (kube-prometheus-stack-grafana, ...)
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KonstantinFomenko/homelab-gitops.git
    targetRevision: main
    path: platform/kube-prometheus-stack
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The chart's CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
