# External Secrets Operator: Vault -> Kubernetes Secret. Component with CRDs: deliberately NO
# resources-finalizer — deleting this file leaves the CRDs and every synced Secret in place.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KonstantinFomenko/homelab-gitops.git
    targetRevision: main
    path: platform/external-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
