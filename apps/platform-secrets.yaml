# Secrets of the showcase services from Vault platform/<namespace> through External Secrets Operator.
# The only Application that depends on ESO: the operator, monitoring and Argo CD charts never get
# ESO objects. Every object names its namespace. Deliberately NO resources-finalizer: deleting this
# file must not delete the Secrets the running services use.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-secrets
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KonstantinFomenko/homelab-gitops.git
    targetRevision: main
    path: platform/platform-secrets
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      # From scratch: ESO's CRDs and namespace tailscale come with other Applications of the same root sync.
      - SkipDryRunOnMissingResource=true
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
