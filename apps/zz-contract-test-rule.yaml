# TEMPORARY: checks that Prometheus picks up a PrometheusRule without labels in any namespace.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: contract-test
  namespace: argocd
spec:
  groups:
    - name: contract-test
      rules:
        - alert: ContractTestRule
          expr: vector(1)
          labels:
            severity: info
