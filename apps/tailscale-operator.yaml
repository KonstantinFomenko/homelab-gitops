# Tailscale Kubernetes operator: an HTTPS address in the tailnet (MagicDNS name, Let's Encrypt) for each lab UI,
# reachable only inside the tailnet. Component with CRDs: deliberately NO resources-finalizer —
# deleting this file leaves the CRDs in place (rollback in README).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/KonstantinFomenko/homelab-gitops.git
    targetRevision: main
    path: platform/tailscale-operator
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      # The chart's CRDs exceed the client-side apply annotation limit.
      - ServerSideApply=true
    # ProxyClass waits for its CRD in the same sync.
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
