external-secrets:
  # Only namespaced SecretStores: each application reads Vault with its own role, so one namespace
  # can never read another's secrets. No cluster-wide stores, no push back into Vault.
  crds:
    createClusterSecretStore: false
    createClusterExternalSecret: false
    createClusterPushSecret: false
    createPushSecret: false
  processClusterStore: false
  processClusterExternalSecret: false
  processClusterPushSecret: false
  processPushSecret: false

  nodeSelector:
    node-role: app
  # Measured 2026-10-07 at rest (requests ≈ rest, limits ≈ 2×): controller 74Mi, webhook 73Mi, cert-controller 72Mi.
  resources:
    requests: { cpu: 10m, memory: 80Mi }
    limits: { memory: 192Mi }

  webhook:
    nodeSelector:
      node-role: app
    resources:
      requests: { cpu: 10m, memory: 80Mi }
      limits: { memory: 160Mi }

  certController:
    nodeSelector:
      node-role: app
    resources:
      requests: { cpu: 10m, memory: 80Mi }
      limits: { memory: 160Mi }
