# Values for the argo-cd dependency live under the `argo-cd:` key.
# The same chart is rendered by the manual bootstrap and by Argo CD itself (apps/argocd.yaml),
# so this file is the only place where Argo CD is configured.
argo-cd:
  global:
    # All Argo CD components run on the control-plane node (rpi-01): it hosts k3s server + GitOps,
    # rpi-02/03 stay for apps and data. Overriding nodeSelector drops the chart default, so os is set again.
    nodeSelector:
      node-role: control-plane
      kubernetes.io/os: linux
    tolerations:
      - key: node-role
        operator: Equal
        value: control-plane
        effect: NoSchedule

  # Not needed: no SSO, no notifications yet (alerts come with kube-prometheus-stack).
  dex:
    enabled: false
  notifications:
    enabled: false

  # Single redis without HA and without persistence.
  redis-ha:
    enabled: false

  # Resources: requests ≈ steady use on rpi-01, memory limits ≈ 1.5–2× the peak.
  # Re-measured 2026-10-06 with kube-prometheus-stack, over 6.5 h incl. a cold start of all nodes:
  # the old 512Mi controller limit would have OOMed (peak 519Mi).
  #
  # Metrics: plain `<component>-metrics` Services only. Their ServiceMonitor lives in
  # platform/kube-prometheus-stack, so Argo CD never depends on the monitoring CRDs.
  controller:
    metrics:
      enabled: true
    resources:
      requests: { cpu: 100m, memory: 320Mi } # peak 519Mi (cold start), steady ~320Mi
      limits: { cpu: "1", memory: 768Mi }

  repoServer:
    metrics:
      enabled: true
    # Repo cache in an on-disk emptyDir (SD card): memory-backed cache would count against the
    # container memory limit. Clones of a few small repos — small writes.
    emptyDir:
      sizeLimit: 512Mi
    resources:
      requests: { cpu: 50m, memory: 128Mi } # peak 288Mi (cold start), steady ~120Mi
      limits: { cpu: "1", memory: 512Mi }

  server:
    metrics:
      enabled: true
    resources:
      requests: { cpu: 20m, memory: 96Mi } # peak 8m / 71Mi; limit leaves room for UI on big apps
      limits: { cpu: 500m, memory: 256Mi }

  redis:
    resources:
      requests: { cpu: 10m, memory: 32Mi } # peak 6m / 32Mi; no maxmemory, cache grows with apps
      limits: { cpu: 200m, memory: 128Mi }

  applicationSet:
    metrics:
      enabled: true
    resources:
      requests: { cpu: 10m, memory: 48Mi } # peak 2m / 46Mi
      limits: { cpu: 200m, memory: 96Mi }

  # Hook job that creates the redis password secret.
  redisSecretInit:
    resources:
      requests: { cpu: 10m, memory: 32Mi } # full argocd binary, not measured
      limits: { cpu: 200m, memory: 128Mi }
