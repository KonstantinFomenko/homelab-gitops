# Values for the kube-prometheus-stack dependency live under the `kube-prometheus-stack:` key.
# Rendered by Argo CD as release `kube-prometheus-stack` in namespace `monitoring` (apps/kube-prometheus-stack.yaml).
#
# Layout: everything except node-exporter runs on the data node (rpi-03, node-role=data).
# Storage: no PVCs. Prometheus TSDB, Alertmanager state and Grafana's sqlite live in tmpfs —
# the lab never writes metrics to SD cards; history is lost on pod restart or power loss.
kube-prometheus-stack:

  # --- Targets that k3s does not expose --------------------------------------------------------
  # k3s runs controller-manager and scheduler inside one process bound to 127.0.0.1, has no etcd
  # with a single server (sqlite/kine), and kube-proxy is replaced by Cilium (kubeProxyReplacement).
  # Exposing them needs k3s flags, which are owned by the node setup, not by this repository.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # --- Control plane metrics: k3s serves them anyway -------------------------------------------
  # The k3s server is one process with one metrics registry: the kubelet's /metrics on rpi-01 and the
  # apiserver endpoint both return apiserver_*, etcd_*, scheduler_*, workqueue_* ... Through the
  # kubelet that was ~45k duplicate series (of ~100k), and every operator with CRDs adds more
  # (histograms are labelled by API group and resource).
  kubeApiServer:
    serviceMonitor:
      # Overriding the list replaces the chart's default, so its rule (first) is copied from 91.9.0.
      metricRelabelings:
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels: [__name__, le]
        # Histograms no chart rule or dashboard reads (~11k series). The SLO rules (burn rate,
        # availability) and the apiserver dashboard use apiserver_request_sli_duration_seconds — kept.
        - action: drop
          regex: apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_.*_bucket
          sourceLabels: [__name__]
  kubelet:
    serviceMonitor:
      # Applies to the kubelet's /metrics endpoint only (cAdvisor and probes have their own keys).
      # An allowlist, not a denylist: a k3s upgrade brings new metric families, and a denylist
      # would let them through. The list = what the kubelet dashboard and chart rules read.
      metricRelabelings:
        - action: drop # chart default (91.9.0), copied because this list replaces it
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        - action: keep
          sourceLabels: [__name__]
          regex: kubelet_.*|process_.*|go_.*|volume_.*|storage_operation_.*|prober_.*|rest_client_requests_total|rest_client_request_duration_seconds_bucket

  defaultRules:
    rules:
      # Rule groups for the targets disabled above — they would only produce "target down" noise.
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
    # Single alerts that fire on a healthy cluster. Each one: why, and what still covers the risk.
    disabled:
      # Small containers with CPU limits on a Pi (sidecars, config-reloader, node-exporter) spend
      # 25–95% of CFS periods throttled in short bursts while idle. Info severity, no action to take;
      # real starvation shows up as failing probes and restarts (KubePodCrashLooping, KubePodNotReady).
      CPUThrottlingHigh: true
      # The default is `vector(1)`: it keeps firing while Prometheus is up but writes nothing
      # (full TSDB, stuck compaction). Replaced by the lab's Watchdog in group `monitoring` below.
      Watchdog: true

  # --- Lab rules: the single place for cluster-level rules of this lab -------------------------
  # Application rules (e.g. slo-operator) ship their own PrometheusRule objects instead.
  additionalPrometheusRulesMap:
    homelab:
      groups:
        - name: argocd
          rules:
            - alert: ArgoCDApplicationNotSyncedOrHealthy
              expr: argocd_app_info{sync_status!="Synced"} or argocd_app_info{health_status!="Healthy"}
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Argo CD Application {{ $labels.name }} is {{ $labels.sync_status }}/{{ $labels.health_status }}
                description: Not Synced/Healthy for 15 minutes. Check with `kubectl describe application {{ $labels.name }} -n argocd`.
            - alert: ArgoCDControllerMetricsAbsent
              # A dead application controller keeps the last Application status in place,
              # so the rule above would stay silent. No controller metrics = no status at all.
              expr: absent(up{job="argocd-application-controller-metrics"} == 1)
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: No metrics from the Argo CD application controller
                description: The controller is down or not scraped; Application statuses are stale.
        - name: cert-manager
          rules:
            - alert: CertificateExpiresSoon
              # cert-manager renews 30 days ahead, so this fires only if renewal is stuck.
              # Vault's certificate is the exception: cert-manager renews it, but Vault reads the new
              # file only on SIGHUP (`kubectl exec -n vault vault-0 -- sh -c 'kill -HUP $(pidof vault)'`, no unseal needed).
              # The certificate's namespace is exported_namespace; namespace is cert-manager's own.
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 86400
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in less than 30 days
                description: Renewal is stuck. Check with `kubectl describe certificate {{ $labels.name }} -n {{ $labels.exported_namespace }}`.
            - alert: CertificateNotReady
              expr: certmanager_certificate_ready_status{condition="False"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
                description: Check with `kubectl describe certificate {{ $labels.name }} -n {{ $labels.exported_namespace }}`.
        - name: monitoring
          rules:
            - alert: Watchdog
              # Heartbeat that depends on data: fires only while fresh samples are written.
              # When ingestion stops, `up` goes stale within 5 minutes and the alert resolves.
              # Same name and severity as the chart's, so Alertmanager's routing of it is unchanged.
              expr: vector(1) and on() (count(up{job="apiserver"} == 1) > 0)
              labels:
                severity: none
              annotations:
                summary: Heartbeat — Prometheus is writing data
                description: Always firing while Prometheus ingests samples. Its absence means monitoring is broken.
            - alert: PrometheusSeriesHigh
              # Budget: ~45k series after the kubelet allowlist; TSDB space is sized for it.
              expr: prometheus_tsdb_head_series{job="kube-prometheus-stack-prometheus"} > 75000
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: Prometheus has {{ $value | humanize }} series (budget 75k)
                description: TSDB space in tmpfs is sized for the budget. Find the source with `topk(20, count by (__name__, job)({__name__=~".+"}))` and relabel it.
            - alert: PrometheusTSDBNearlyFull
              # Blocks + WAL against the tmpfs sizeLimit (1.5Gi). retentionSize keeps them near 1.1GB;
              # more means retention cannot keep up and the volume will fill.
              expr: (prometheus_tsdb_storage_blocks_bytes{job="kube-prometheus-stack-prometheus"} + prometheus_tsdb_wal_storage_size_bytes{job="kube-prometheus-stack-prometheus"}) > 0.85 * 1.5 * 1024^3
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Prometheus TSDB uses {{ $value | humanize1024 }}B of 1.5GiB tmpfs
                description: Check `prometheus_tsdb_compactions_failed_total` and the WAL size. Runbook in README (Monitoring, TSDB full).
            - alert: MonitoringContainerOOMKilled
              # After an OOM the in-memory TSDB is empty, so restart-based alerts never fire.
              # kube-state-metrics reports the last termination reason, which survives the restart.
              expr: kube_pod_container_status_last_terminated_reason{namespace="monitoring",reason="OOMKilled"} == 1
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.pod }}/{{ $labels.container }} was OOMKilled"
                description: Memory limit too low (tmpfs counts against it). Metrics history was lost.

  # --- Prometheus Operator ---------------------------------------------------------------------
  prometheusOperator:
    # The webhooks' certificates are made by Helm hook jobs (pre-install create, post-install patch),
    # which under Argo CD give a permanent diff and a failing patch job. Rules are validated in CI
    # of their owners instead (promtool check rules).
    admissionWebhooks:
      enabled: false
    # The operator's TLS uses the certificate secret created by the webhook jobs — off with them.
    tls:
      enabled: false
    nodeSelector:
      node-role: data
    # Measured 2026-10-06 over 6.5 h incl. a cold start (peak / steady): operator 9m 80Mi / 79Mi.
    resources:
      requests: { cpu: 20m, memory: 80Mi }
      limits: { cpu: 200m, memory: 192Mi }
    prometheusConfigReloader:
      # Sidecar in the Prometheus and Alertmanager pods. Peak 1m 13Mi.
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }

  # --- Prometheus ------------------------------------------------------------------------------
  prometheus:
    # Argo CD metrics. The argo-cd chart only exposes plain metrics Services (metrics.enabled),
    # so Argo CD itself never depends on the monitoring CRDs.
    additionalServiceMonitors:
      - name: argocd
        selector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [argocd-metrics, argocd-repo-server-metrics, argocd-server-metrics]
        namespaceSelector:
          matchNames: [argocd]
        endpoints:
          - port: http-metrics
      # cert-manager controller: certificate expiry and readiness (rules: group cert-manager).
      - name: cert-manager
        selector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/component: controller
        namespaceSelector:
          matchNames: [cert-manager]
        endpoints:
          - port: http-metrics

    prometheusSpec:
      replicas: 1
      nodeSelector:
        node-role: data

      # Pick up every ServiceMonitor/PodMonitor/PrometheusRule/Probe in every namespace, without labels.
      # This is the contract for applications (slo-operator) — see README, Monitoring.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      ruleNamespaceSelector: {}
      probeNamespaceSelector: {}

      # TSDB in tmpfs. retentionSize counts blocks + WAL + head chunks but frees only blocks.
      # Sized 2026-10-08 for ~45k series: WAL peaks ~310MB, head chunks ~50MB, 3 days of blocks
      # ~550–610MB → retentionSize 1100MB, peak ~1.18GB with compaction (~77% of 1.5Gi).
      retention: 3d
      retentionSize: 1100MB
      storageSpec:
        emptyDir:
          medium: Memory
          sizeLimit: 1.5Gi
      # Each head compaction preallocates a chunk segment of this size before writing the block.
      # The default (512MiB) failed as soon as less than 512MiB of the tmpfs was free; compaction then
      # never succeeded again, the WAL was never truncated and filled the volume. Hidden flag of
      # Prometheus (must be > 1MB); a 2h block is ~20–35MB.
      additionalArgs:
        - name: storage.tsdb.max-block-chunk-segment-size
          value: 64MB

      # tmpfs counts against the container memory limit: limit = working memory + sizeLimit (1.5Gi).
      # Peak 73m / 1152Mi with 6.5 h of TSDB (2026-10-06).
      resources:
        requests: { cpu: 200m, memory: 1Gi }
        limits: { cpu: "1", memory: 3072Mi }

  # --- Alertmanager ----------------------------------------------------------------------------
  # Receiver is the chart default `null`: alerts are visible in the UI and API (/api/v2/alerts).
  # Delivery outside the cluster comes later with a secret from Vault.
  alertmanager:
    alertmanagerSpec:
      replicas: 1
      nodeSelector:
        node-role: data
      # Silences live here and are lost on restart — never silence, disable rules in values instead.
      storage:
        emptyDir:
          medium: Memory
      resources:
        requests: { cpu: 10m, memory: 48Mi } # peak 1m / 42Mi
        limits: { cpu: 200m, memory: 128Mi }

  # --- Grafana ---------------------------------------------------------------------------------
  grafana:
    nodeSelector:
      node-role: data
    # Admin credentials from a Secret created by hand before the first sync (README, Bootstrap).
    # The chart's default password is public and never used.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # sqlite (sessions, settings) in tmpfs; dashboards come from ConfigMaps via the sidecar.
    persistence:
      enabled: false
      inMemory:
        enabled: true
        sizeLimit: 128Mi # Grafana 13's sqlite is ~52Mi right after start
    # Grafana + two sidecars (dashboards, datasources). Start values 256Mi/64Mi were OOMKilled in a loop.
    # Peak 84m / 456Mi, steady ~455Mi (rss ~200Mi + page cache incl. the sqlite tmpfs).
    resources:
      requests: { cpu: 30m, memory: 448Mi }
      limits: { cpu: 300m, memory: 768Mi }
    # The chart's ClusterRole lets the sidecars read Secrets in every namespace.
    # Keep Grafana to its own namespace: a Role, and dashboards only from `monitoring`.
    rbac:
      namespaced: true
    # `helm test` pod: Helm-only, never run under Argo CD.
    testFramework:
      enabled: false
    sidecar:
      dashboards:
        searchNamespace: monitoring
      resources:
        # Peak 54m / 101Mi (dashboards), 53m / 73Mi (datasources).
        requests: { cpu: 10m, memory: 96Mi }
        limits: { cpu: 200m, memory: 192Mi }

  # --- Exporters -------------------------------------------------------------------------------
  kube-state-metrics:
    nodeSelector:
      node-role: data
    resources:
      requests: { cpu: 20m, memory: 80Mi } # peak 2m / 70Mi
      limits: { cpu: 200m, memory: 160Mi }

  # DaemonSet on all three nodes (the chart tolerates every NoSchedule taint, incl. rpi-01's).
  prometheus-node-exporter:
    # Scraped over the pod network: nodes keep UFW `default deny` without a rule for 9100.
    # Cost: network counters are those of the pod's network namespace, not of the node's interfaces.
    # hostPID and read-only host /proc, /sys and / stay — CPU, memory and filesystems are the node's.
    hostNetwork: false
    resources:
      requests: { cpu: 10m, memory: 32Mi } # peak 5m / 26Mi
      limits: { cpu: 200m, memory: 64Mi }
