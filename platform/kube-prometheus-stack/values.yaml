# Values for the kube-prometheus-stack dependency live under the `kube-prometheus-stack:` key.
# Rendered by Argo CD as release `kube-prometheus-stack` in namespace `monitoring` (apps/kube-prometheus-stack.yaml).
#
# Layout: everything except node-exporter runs on the data node (rpi-03, node-role=data).
# Storage: no PVCs. Prometheus TSDB, Alertmanager state and Grafana's sqlite live in tmpfs —
# the lab never writes metrics to SD cards; history is lost on pod restart or power loss.
kube-prometheus-stack:

  # --- Targets that k3s does not expose --------------------------------------------------------
  # k3s runs controller-manager and scheduler inside one process bound to 127.0.0.1, has no etcd
  # with a single server (sqlite/kine), and kube-proxy is replaced by Cilium (kubeProxyReplacement).
  # Exposing them needs k3s flags, which are owned by the node setup, not by this repository.
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false

  # --- Control plane metrics: k3s serves them anyway -------------------------------------------
  # The k3s server is one process with one metrics registry: the kubelet's /metrics on rpi-01 and the
  # apiserver endpoint both return apiserver_*, etcd_*, scheduler_*, workqueue_* ... Through the
  # kubelet that was ~45k duplicate series (of ~100k), and every operator with CRDs adds more
  # (histograms are labelled by API group and resource).
  kubeApiServer:
    serviceMonitor:
      # Overriding the list replaces the chart's default, so its rule (first) is copied from 91.9.0.
      metricRelabelings:
        - action: drop
          regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
          sourceLabels: [__name__, le]
        # Histograms no chart rule or dashboard reads (~11k series). The SLO rules (burn rate,
        # availability) and the apiserver dashboard use apiserver_request_sli_duration_seconds — kept.
        - action: drop
          regex: apiserver_request_duration_seconds_bucket|apiserver_request_body_size_bytes_bucket|apiserver_response_sizes_bucket|apiserver_watch_.*_bucket
          sourceLabels: [__name__]
  kubelet:
    serviceMonitor:
      # Applies to the kubelet's /metrics endpoint only (cAdvisor and probes have their own keys).
      # An allowlist, not a denylist: a k3s upgrade brings new metric families, and a denylist
      # would let them through. The list = what the kubelet dashboard and chart rules read.
      metricRelabelings:
        - action: drop # chart default (91.9.0), copied because this list replaces it
          sourceLabels: [__name__, le]
          regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
        - action: keep
          sourceLabels: [__name__]
          regex: kubelet_.*|process_.*|go_.*|volume_.*|storage_operation_.*|prober_.*|rest_client_requests_total|rest_client_request_duration_seconds_bucket

  # Severity is the routing contract (README, Contracts): `critical` wakes at night and means
  # "today", `warning` means "by Saturday". The chart's critical rules kept as critical: the four
  # NodeFilesystem* (a full /run stops the node), KubeletDown, KubeAPIDown,
  # KubeClientCertificateExpiration (< 24 h, then the cluster stops), KubePersistentVolume*FillingUp
  # (the only PV is Vault's data). The rest is either disabled below or lowered here: nothing is lost
  # by waiting until morning, and a full stop of Prometheus or Alertmanager is the dead-man's switch's job.
  # An override applies to every rule with that name (all its severity variants).
  customRules:
    AlertmanagerFailedReload: { severity: warning }         # the previous config keeps working
    AlertmanagerClusterFailedToSendAlerts: { severity: warning } # Telegram failures: external check, see route
    AlertmanagerClusterCrashlooping: { severity: warning }  # also KubePodCrashLooping
    KubeStateMetricsListErrors: { severity: warning }       # slow apiserver on cold start; stale metrics only
    KubeStateMetricsWatchErrors: { severity: warning }
    KubePersistentVolumeErrors: { severity: warning }       # the pod using the volume shows it too
    PrometheusBadConfig: { severity: warning }              # the previous config keeps working
    PrometheusRuleFailures: { severity: warning }
    PrometheusTargetSyncFailure: { severity: warning }
    PrometheusErrorSendingAlertsToAnyAlertmanager: { severity: warning } # all errors = no Watchdog = external check

  defaultRules:
    rules:
      # Rule groups for the targets disabled above — they would only produce "target down" noise.
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false
      # Holds only KubeAPIErrorBudgetBurn (disabled below). Disabling the alert alone renders the
      # group with `rules: null`, which the PrometheusRule CRD rejects — and Argo CD's dry run then
      # fails the whole sync. The burn-rate recording rules (dashboard) are a separate group, kept.
      kubeApiserverSlos: false
    # Single alerts that fire on a healthy cluster or cannot fire here at all. Each one: why, and
    # what still covers the risk. Disabling by name removes every severity variant of the alert.
    disabled:
      # One Alertmanager replica: no cluster to be inconsistent, and a dead Alertmanager cannot
      # report its own death — the external dead-man's switch on Watchdog does (README, Alert delivery).
      AlertmanagerMembersInconsistent: true
      AlertmanagerConfigInconsistent: true
      AlertmanagerClusterDown: true
      # The lab has no API availability SLO; the 99% budget burns on every cold start (kine on SD).
      # A real outage is KubeAPIDown.
      KubeAPIErrorBudgetBurn: true
      # Cannot fire here: kube-state-metrics is not sharded (no shard metrics), k3s does not expose
      # kubelet_certificate_manager_* (k3s certificates: KubeClientCertificateExpiration), no md RAID,
      # node_filefd_maximum is unlimited, no remote write.
      KubeStateMetricsShardingMismatch: true
      KubeStateMetricsShardsMissing: true
      KubeletClientCertificateExpiration: true
      KubeletServerCertificateExpiration: true
      NodeRAIDDegraded: true
      NodeFileDescriptorLimit: true
      PrometheusRemoteStorageFailures: true
      PrometheusRemoteWriteBehind: true
      # Small containers with CPU limits on a Pi (sidecars, config-reloader, node-exporter) spend
      # 25–95% of CFS periods throttled in short bursts while idle. Info severity, no action to take;
      # real starvation shows up as failing probes and restarts (KubePodCrashLooping, KubePodNotReady).
      CPUThrottlingHigh: true
      # The default is `vector(1)`: it keeps firing while Prometheus is up but writes nothing
      # (full TSDB, stuck compaction). Replaced by the lab's Watchdog in group `monitoring` below.
      Watchdog: true

  # --- Lab rules: the single place for cluster-level rules of this lab -------------------------
  # Application rules (e.g. slo-operator) ship their own PrometheusRule objects instead.
  additionalPrometheusRulesMap:
    homelab:
      groups:
        - name: argocd
          rules:
            - alert: ArgoCDApplicationNotSyncedOrHealthy
              expr: argocd_app_info{sync_status!="Synced"} or argocd_app_info{health_status!="Healthy"}
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Argo CD Application {{ $labels.name }} is {{ $labels.sync_status }}/{{ $labels.health_status }}
                description: Not Synced/Healthy for 15 minutes. Check with `kubectl describe application {{ $labels.name }} -n argocd`.
            - alert: ArgoCDControllerMetricsAbsent
              # A dead application controller keeps the last Application status in place,
              # so the rule above would stay silent. No controller metrics = no status at all.
              expr: absent(up{job="argocd-application-controller-metrics"} == 1)
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: No metrics from the Argo CD application controller
                description: The controller is down or not scraped; Application statuses are stale.
        - name: cert-manager
          rules:
            - alert: CertificateExpiresSoon
              # cert-manager renews 30 days ahead, so this fires only if renewal is stuck.
              # Vault's certificate is the exception: cert-manager renews it, but Vault reads the new
              # file only on SIGHUP (`kubectl exec -n vault vault-0 -- sh -c 'kill -HUP $(pidof vault)'`, no unseal needed).
              # The certificate's namespace is exported_namespace; namespace is cert-manager's own.
              expr: certmanager_certificate_expiration_timestamp_seconds - time() < 30 * 86400
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} expires in less than 30 days
                description: Renewal is stuck. Check with `kubectl describe certificate {{ $labels.name }} -n {{ $labels.exported_namespace }}`.
            - alert: CertificateNotReady
              expr: certmanager_certificate_ready_status{condition="False"} == 1
              for: 30m
              labels:
                severity: warning
              annotations:
                summary: Certificate {{ $labels.exported_namespace }}/{{ $labels.name }} is not Ready
                description: Check with `kubectl describe certificate {{ $labels.name }} -n {{ $labels.exported_namespace }}`.
        - name: vault
          rules:
            - alert: VaultNotReady
              # Vault has no metrics yet; its readiness probe fails while it is sealed, so this
              # catches "sealed" as well as "down". Sealed after a power loss is normal until
              # auto-unseal, hence warning. Runbook: README, Contracts.
              expr: kube_pod_status_ready{namespace="vault",condition="true"} == 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Vault pod {{ $labels.pod }} is not Ready
                description: Sealed or down for 15 minutes; External Secrets cannot refresh secrets. Check with `kubectl exec -n vault {{ $labels.pod }} -- vault status`.
        - name: monitoring
          rules:
            - alert: Watchdog
              # Heartbeat that depends on data: fires only while fresh samples are written.
              # When ingestion stops, `up` goes stale within 5 minutes and the alert resolves.
              # Same name and severity as the chart's, so Alertmanager's routing of it is unchanged.
              expr: vector(1) and on() (count(up{job="apiserver"} == 1) > 0)
              labels:
                severity: none
              annotations:
                summary: Heartbeat — Prometheus is writing data
                description: Always firing while Prometheus ingests samples. Its absence means monitoring is broken.
            - alert: PrometheusSeriesHigh
              # Budget: ~45k series after the kubelet allowlist; TSDB space is sized for it.
              expr: prometheus_tsdb_head_series{job="kube-prometheus-stack-prometheus"} > 75000
              for: 1h
              labels:
                severity: warning
              annotations:
                summary: Prometheus has {{ $value | humanize }} series (budget 75k)
                description: TSDB space in tmpfs is sized for the budget. Find the source with `topk(20, count by (__name__, job)({__name__=~".+"}))` and relabel it.
            - alert: PrometheusTSDBNearlyFull
              # Blocks + WAL against the tmpfs sizeLimit (1.5Gi). retentionSize keeps them near 1.1GB;
              # more means retention cannot keep up and the volume will fill.
              expr: (prometheus_tsdb_storage_blocks_bytes{job="kube-prometheus-stack-prometheus"} + prometheus_tsdb_wal_storage_size_bytes{job="kube-prometheus-stack-prometheus"}) > 0.85 * 1.5 * 1024^3
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: Prometheus TSDB uses {{ $value | humanize1024 }}B of 1.5GiB tmpfs
                description: Check `prometheus_tsdb_compactions_failed_total` and the WAL size. Runbook in README (Monitoring, TSDB full).
            - alert: MonitoringContainerOOMKilled
              # After an OOM the in-memory TSDB is empty, so restart-based alerts never fire.
              # kube-state-metrics reports the last termination reason, which survives the restart —
              # until the next one, so it is limited to terminations within the last hour (the reason
              # alone kept firing, and was re-sent every 12 h). The timestamp survives the TSDB loss too.
              expr: |
                kube_pod_container_status_last_terminated_reason{namespace="monitoring",reason="OOMKilled"} == 1
                and on (namespace, pod, container)
                (time() - kube_pod_container_status_last_terminated_timestamp{namespace="monitoring"}) < 3600
              labels:
                severity: warning
              annotations:
                summary: "{{ $labels.pod }}/{{ $labels.container }} was OOMKilled"
                description: Memory limit too low (tmpfs counts against it). Metrics history was lost.

  # --- Prometheus Operator ---------------------------------------------------------------------
  prometheusOperator:
    # The webhooks' certificates are made by Helm hook jobs (pre-install create, post-install patch),
    # which under Argo CD give a permanent diff and a failing patch job. Rules are validated in CI
    # of their owners instead (promtool check rules).
    admissionWebhooks:
      enabled: false
    # The operator's TLS uses the certificate secret created by the webhook jobs — off with them.
    tls:
      enabled: false
    nodeSelector:
      node-role: data
    # Measured 2026-10-06 over 6.5 h incl. a cold start (peak / steady): operator 9m 80Mi / 79Mi.
    resources:
      requests: { cpu: 20m, memory: 80Mi }
      limits: { cpu: 200m, memory: 192Mi }
    prometheusConfigReloader:
      # Sidecar in the Prometheus and Alertmanager pods. Peak 1m 13Mi.
      resources:
        requests: { cpu: 5m, memory: 16Mi }
        limits: { cpu: 100m, memory: 32Mi }

  # --- Prometheus ------------------------------------------------------------------------------
  prometheus:
    # Argo CD metrics. The argo-cd chart only exposes plain metrics Services (metrics.enabled),
    # so Argo CD itself never depends on the monitoring CRDs.
    additionalServiceMonitors:
      - name: argocd
        selector:
          matchExpressions:
            - key: app.kubernetes.io/name
              operator: In
              values: [argocd-metrics, argocd-repo-server-metrics, argocd-server-metrics]
        namespaceSelector:
          matchNames: [argocd]
        endpoints:
          - port: http-metrics
      # cert-manager controller: certificate expiry and readiness (rules: group cert-manager).
      - name: cert-manager
        selector:
          matchLabels:
            app.kubernetes.io/name: cert-manager
            app.kubernetes.io/component: controller
        namespaceSelector:
          matchNames: [cert-manager]
        endpoints:
          - port: http-metrics

    prometheusSpec:
      replicas: 1
      nodeSelector:
        node-role: data

      # Pick up every ServiceMonitor/PodMonitor/PrometheusRule/Probe in every namespace, without labels.
      # This is the contract for applications (slo-operator) — see README, Monitoring.
      serviceMonitorSelectorNilUsesHelmValues: false
      podMonitorSelectorNilUsesHelmValues: false
      ruleSelectorNilUsesHelmValues: false
      probeSelectorNilUsesHelmValues: false
      serviceMonitorNamespaceSelector: {}
      podMonitorNamespaceSelector: {}
      ruleNamespaceSelector: {}
      probeNamespaceSelector: {}

      # TSDB in tmpfs. retentionSize counts blocks + WAL + head chunks but frees only blocks.
      # Sized 2026-10-08 for ~45k series: WAL peaks ~310MB, head chunks ~50MB, 3 days of blocks
      # ~550–610MB → retentionSize 1100MB, peak ~1.18GB with compaction (~77% of 1.5Gi).
      retention: 3d
      retentionSize: 1100MB
      storageSpec:
        emptyDir:
          medium: Memory
          sizeLimit: 1.5Gi
      # Each head compaction preallocates a chunk segment of this size before writing the block.
      # The default (512MiB) failed as soon as less than 512MiB of the tmpfs was free; compaction then
      # never succeeded again, the WAL was never truncated and filled the volume. Hidden flag of
      # Prometheus (must be > 1MB); a 2h block is ~20–35MB.
      additionalArgs:
        - name: storage.tsdb.max-block-chunk-segment-size
          value: 64MB

      # tmpfs counts against the container memory limit: limit = working memory + sizeLimit (1.5Gi).
      # Peak 73m / 1152Mi with 6.5 h of TSDB (2026-10-06).
      resources:
        requests: { cpu: 200m, memory: 1Gi }
        limits: { cpu: "1", memory: 3072Mi }

  # --- Alertmanager ----------------------------------------------------------------------------
  # Delivery: Telegram (a private channel of the lab's own bot) and an external dead-man's switch
  # (healthchecks.io). Routes live here, in git; only the credentials come from the hand-made Secret
  # `alertmanager-telegram` (README, Bootstrap), mounted at /etc/alertmanager/secrets/<name>/<key>.
  # Moves to Vault + External Secrets once Vault unseals itself (SPEC-036): the channel for outages
  # must not depend on a component that stays sealed after every power loss.
  # Routes match on severity only — an application that needs its own route ships an
  # AlertmanagerConfig in its namespace.
  alertmanager:
    # Replaces the chart's config: inhibit_rules and the `null` receiver are copied from 91.9.0.
    config:
      global:
        resolve_timeout: 5m
      inhibit_rules:
        - source_matchers: ['severity = critical']
          target_matchers: ['severity =~ warning|info']
          equal: ['namespace', 'alertname']
        - source_matchers: ['severity = warning']
          target_matchers: ['severity = info']
          equal: ['namespace', 'alertname']
        - source_matchers: ['alertname = InfoInhibitor']
          target_matchers: ['severity = info']
          equal: ['namespace']
        - target_matchers: ['alertname = InfoInhibitor']
      # Asia/Tbilisi is where the lab's owner sleeps; change on relocation.
      time_intervals:
        - name: night
          time_intervals:
            - times:
                - { start_time: "23:00", end_time: "24:00" }
                - { start_time: "00:00", end_time: "08:00" }
              location: Asia/Tbilisi
      route:
        group_by: ['namespace']
        group_wait: 30s
        group_interval: 5m
        repeat_interval: 12h
        receiver: 'null'
        routes:
          # Heartbeat to the external check "cluster alive": no ping for 30 min = power loss,
          # rpi-03 down, Prometheus or Alertmanager stopped, or Prometheus not writing (Watchdog
          # depends on fresh data).
          - receiver: healthchecks-watchdog
            matchers: ['alertname = "Watchdog"']
            group_by: ['alertname']
            group_wait: 0s
            group_interval: 1m
            repeat_interval: 5m
          # Telegram itself failing: signal the external check "delivery broken", which notifies
          # through its own channels. Continues to Telegram below for transient failures.
          - receiver: healthchecks-delivery-failed
            matchers:
              - 'alertname =~ "AlertmanagerFailedToSendAlerts|AlertmanagerClusterFailedToSendAlerts"'
              - 'integration = "telegram"'
            group_by: ['alertname']
            group_wait: 0s
            repeat_interval: 1h
            continue: true
          - receiver: 'null'
            matchers: ['severity = "info"']
          - receiver: 'null'
            matchers: ['alertname = "InfoInhibitor"']
          # Not critical: at night without sound, by day with sound. An active route outside its
          # interval still matches and stays silent, hence the pair with `continue`. An alert that
          # spans 23:00 or 08:00 arrives in both — the morning one is the summary of the night.
          - receiver: telegram-silent
            matchers: ['severity != "critical"']
            active_time_intervals: [night]
            continue: true
          - receiver: telegram
            matchers: ['severity != "critical"']
            mute_time_intervals: [night]
          # Critical: with sound at any time. The list of critical rules is curated (customRules).
          - receiver: telegram
      receivers:
        - name: 'null'
        - name: telegram
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
              chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
              send_resolved: true
              parse_mode: HTML
              message: '{{ template "telegram.lab.message" . }}'
        - name: telegram-silent
          telegram_configs:
            - bot_token_file: /etc/alertmanager/secrets/alertmanager-telegram/bot-token
              chat_id_file: /etc/alertmanager/secrets/alertmanager-telegram/chat-id
              send_resolved: true
              disable_notifications: true
              parse_mode: HTML
              message: '{{ template "telegram.lab.message" . }}'
        - name: healthchecks-watchdog
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/alertmanager-telegram/watchdog-url
              send_resolved: false
        - name: healthchecks-delivery-failed
          webhook_configs:
            - url_file: /etc/alertmanager/secrets/alertmanager-telegram/failed-url # the check's /fail URL
              send_resolved: false
      templates:
        - '/etc/alertmanager/config/*.tmpl'
    # Telegram message: what happened and where, not every label. Runbook as a link; the chart's
    # generatorURL points to the in-cluster Prometheus and is left out. Values are HTML-escaped.
    # Check after a change: README, Alert delivery.
    templateFiles:
      telegram.tmpl: |-
        {{/* One alert: name, what happened, the labels that tell where, runbook as a link. */}}
        {{ define "telegram.lab.alert" -}}
        <b>{{ .Labels.alertname | html }}</b>
        {{ with .Annotations.description }}{{ . | html }}{{ else }}{{ with .Annotations.summary }}{{ . | html }}{{ end }}{{ end }}
        {{- $where := .Labels.Remove (stringSlice "alertname" "severity" "namespace" "prometheus" "job" "endpoint" "service" "container" "instance" "uid" "reason" "metrics_path" "device" "fstype") }}
        {{- if eq .Labels.job "node-exporter" }}{{ $where = $where.Remove (stringSlice "pod") }}{{ end }}
        {{- if $where }}
        <i>{{ range $i, $p := $where.SortedPairs }}{{ if $i }} · {{ end }}{{ $p.Name }}: {{ $p.Value | html }}{{ end }}</i>
        {{- end }}
        {{- with .Annotations.runbook_url }}
        <a href="{{ . | html }}">runbook</a>
        {{- end }}
        {{- end }}

        {{/* The whole message: header, up to 8 firing alerts, then the names of resolved ones.
             Telegram cuts at 4096 characters, which would break the HTML. */}}
        {{ define "telegram.lab.message" -}}
        {{ if eq .Status "firing" }}{{ if eq .CommonLabels.severity "critical" }}🔴{{ else }}🟡{{ end }}{{ else }}✅{{ end }}
        {{- " " }}<b>{{ if eq .Status "firing" }}{{ with .CommonLabels.severity }}{{ . }}{{ else }}firing{{ end }}{{ else }}resolved{{ end }}</b>
        {{- with .CommonLabels.namespace }} · {{ . }}{{ end }}
        {{- range $i, $a := .Alerts.Firing }}{{ if lt $i 8 }}

        {{ if not $.CommonLabels.severity }}[{{ $a.Labels.severity }}] {{ end }}{{ template "telegram.lab.alert" $a }}
        {{- end }}{{ end }}
        {{- if gt (len .Alerts.Firing) 8 }}

        … {{ len .Alerts.Firing }} firing in total — /api/v2/alerts
        {{- end }}
        {{- if .Alerts.Resolved }}

        {{ if eq .Status "firing" }}✅ {{ end }}{{ range $i, $a := .Alerts.Resolved }}{{ if $i }}, {{ end }}{{ $a.Labels.alertname | html }}{{ end }}
        {{- end }}
        {{- end }}
    alertmanagerSpec:
      secrets: [alertmanager-telegram]
      replicas: 1
      nodeSelector:
        node-role: data
      # Silences live here and are lost on restart — never silence, disable rules in values instead.
      storage:
        emptyDir:
          medium: Memory
      resources:
        requests: { cpu: 10m, memory: 48Mi } # peak 1m / 42Mi
        limits: { cpu: 200m, memory: 128Mi }

  # --- Grafana ---------------------------------------------------------------------------------
  grafana:
    nodeSelector:
      node-role: data
    # Admin credentials from a Secret created by hand before the first sync (README, Bootstrap).
    # The chart's default password is public and never used.
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # sqlite (sessions, settings) in tmpfs; dashboards come from ConfigMaps via the sidecar.
    persistence:
      enabled: false
      inMemory:
        enabled: true
        sizeLimit: 128Mi # Grafana 13's sqlite is ~52Mi right after start
    # Grafana + two sidecars (dashboards, datasources). Start values 256Mi/64Mi were OOMKilled in a loop.
    # Peak 84m / 456Mi, steady ~455Mi (rss ~200Mi + page cache incl. the sqlite tmpfs).
    resources:
      requests: { cpu: 30m, memory: 448Mi }
      limits: { cpu: 300m, memory: 768Mi }
    # The chart's ClusterRole lets the sidecars read Secrets in every namespace.
    # Keep Grafana to its own namespace: a Role, and dashboards only from `monitoring`.
    rbac:
      namespaced: true
    # `helm test` pod: Helm-only, never run under Argo CD.
    testFramework:
      enabled: false
    sidecar:
      dashboards:
        searchNamespace: monitoring
      resources:
        # Peak 54m / 101Mi (dashboards), 53m / 73Mi (datasources).
        requests: { cpu: 10m, memory: 96Mi }
        limits: { cpu: 200m, memory: 192Mi }

  # --- Exporters -------------------------------------------------------------------------------
  kube-state-metrics:
    nodeSelector:
      node-role: data
    resources:
      requests: { cpu: 20m, memory: 80Mi } # peak 2m / 70Mi
      limits: { cpu: 200m, memory: 160Mi }

  # DaemonSet on all three nodes (the chart tolerates every NoSchedule taint, incl. rpi-01's).
  prometheus-node-exporter:
    # Scraped over the pod network: nodes keep UFW `default deny` without a rule for 9100.
    # Cost: network counters are those of the pod's network namespace, not of the node's interfaces.
    # hostPID and read-only host /proc, /sys and / stay — CPU, memory and filesystems are the node's.
    hostNetwork: false
    # Without hostNetwork `instance` is the pod IP; `node` names the Pi in alerts (/run full on rpi-01).
    prometheus:
      monitor:
        relabelings:
          # `action` is the API default, spelled out: without it Argo CD shows the object OutOfSync.
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
            action: replace
    resources:
      requests: { cpu: 10m, memory: 32Mi } # peak 5m / 26Mi
      limits: { cpu: 200m, memory: 64Mi }
