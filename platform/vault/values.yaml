vault:
  global:
    # TLS everywhere: VAULT_ADDR in the pod is https://127.0.0.1:8200, probes use https.
    tlsDisable: false

  # Secrets reach pods only through External Secrets Operator: no injector, no CSI provider.
  injector:
    enabled: false
  csi:
    enabled: false
  ui:
    enabled: false

  server:
    # One node, integrated storage (Raft). No HA: the only consumer is External Secrets Operator,
    # and the Kubernetes Secrets it writes survive Vault being sealed or down.
    # Auto-unseal through AWS KMS (seal "awskms" below): Vault unseals itself on every start while
    # the internet, the clock and the key are there. The Shamir keys became recovery keys: they
    # authorise generate-root, they do NOT unseal Vault when KMS is unreachable.
    # The StatefulSet uses OnDelete (chart default): a change here takes effect only after
    # `kubectl delete pod -n vault vault-0`.
    ha:
      enabled: true
      replicas: 1
      raft:
        enabled: true
        setNodeId: true
        config: |
          ui = false
          disable_mlock = true

          # Vault 2.0 requires a token for sys/generate-root (CVE-2026-5807). The root token is
          # revoked after setup, so without this a new one could never be generated from the
          # recovery keys. Risk: someone inside the cluster can start/cancel the ceremony, not finish it.
          enable_unauthenticated_access = ["generate-root"]

          # Every parameter comes from the environment (Secret vault-kms, extraSecretEnvironmentVars
          # below): the key ARN holds the account number and stays out of git. Environment variables
          # win over this file. Deleting the KMS key loses Vault and every snapshot taken since
          # the migration (README, Secrets and certificates).
          seal "awskms" {}

          listener "tcp" {
            address         = "[::]:8200"
            cluster_address = "[::]:8201"
            tls_cert_file   = "/vault/userconfig/vault-tls/tls.crt"
            tls_key_file    = "/vault/userconfig/vault-tls/tls.key"
            tls_min_version = "tls12"
          }

          storage "raft" {
            path = "/vault/data"
          }

          service_registration "kubernetes" {}

    # Certificate from templates/certificate.yaml.
    volumes:
      - name: vault-tls
        secret:
          secretName: vault-tls
    volumeMounts:
      - name: vault-tls
        mountPath: /vault/userconfig/vault-tls
        readOnly: true
    extraEnvironmentVars:
      VAULT_CACERT: /vault/userconfig/vault-tls/ca.crt
    # Hand-made Secret (README, Bootstrap), reference copy in the password manager.
    extraSecretEnvironmentVars:
      - { envName: VAULT_SEAL_TYPE, secretName: vault-kms, secretKey: VAULT_SEAL_TYPE }
      - { envName: VAULT_AWSKMS_SEAL_KEY_ID, secretName: vault-kms, secretKey: VAULT_AWSKMS_SEAL_KEY_ID }
      - { envName: AWS_REGION, secretName: vault-kms, secretKey: AWS_REGION }
      - { envName: AWS_ACCESS_KEY_ID, secretName: vault-kms, secretKey: AWS_ACCESS_KEY_ID }
      - { envName: AWS_SECRET_ACCESS_KEY, secretName: vault-kms, secretKey: AWS_SECRET_ACCESS_KEY }

    nodeSelector:
      node-role: app

    # Raft data on the SD card of the app node (local-path), no backup: a deliberate exception to
    # "SD cards are not written" until object storage exists. Losing the card means re-initialising
    # Vault and re-entering secrets from the password manager.
    dataStorage:
      enabled: true
      size: 1Gi
      storageClass: local-path
    auditStorage:
      enabled: false

    # Measured 2026-10-07 at rest: 69Mi.
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        memory: 512Mi
