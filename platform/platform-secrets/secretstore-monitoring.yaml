# Vault access for namespace monitoring only: role platform-monitoring reads platform/monitoring (vault/platform-policies.sh).
# TLS is verified against the lab CA (public cert, cert-manager Secret homelab-ca; a new CA means
# updating caBundle in every SecretStore here).
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: vault
  namespace: monitoring
spec:
  provider:
    vault:
      server: https://vault-active.vault.svc:8200
      path: platform
      version: v2
      caBundle: 
      auth:
        kubernetes:
          mountPath: kubernetes
          role: platform-monitoring
          serviceAccountRef:
            name: default
            audiences: [vault]
