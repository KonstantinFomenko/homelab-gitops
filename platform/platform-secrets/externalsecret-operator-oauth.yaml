# OAuth client of the Tailscale operator (Vault platform/tailscale), mounted by the operator's
# Deployment as Secret operator-oauth. Synced once (CreatedOnce): a sealed Vault never turns it
# Degraded. Changing a value: vault kv put/patch, then delete the Secret — ESO recreates it — and
# restart the operator (README, Secrets of the showcase).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: operator-oauth
  namespace: tailscale
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: operator-oauth
  data:
    - secretKey: client_id
      remoteRef:
        key: tailscale
        property: client_id
    - secretKey: client_secret
      remoteRef:
        key: tailscale
        property: client_secret
