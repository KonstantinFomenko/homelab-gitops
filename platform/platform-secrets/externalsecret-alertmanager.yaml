# Alertmanager's credentials from Vault platform/monitoring/alertmanager — its own record, so a
# `kv put` for another consumer of monitoring never wipes them. Vault keys are named as the Secret's
# keys (dataFrom.extract, no mapping): bot-token, chat-id, watchdog-url, failed-url (with /fail).
# Synced once (CreatedOnce): the channel for outages depends on Vault only while the Secret is created.
# Changing a value: SecretStore vault Ready, vault kv patch, delete the Secret — ESO recreates it —
# and delete the Alertmanager pod (README, Secrets of the showcase).
#
# creationPolicy Owner (default): deleting or pruning this ExternalSecret — a renamed file or object
# here included — garbage-collects the Secret, and Alertmanager will not start after its next restart.
# Rename only together with the emergency command at hand (README, Alert delivery).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-telegram
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: alertmanager-telegram
  dataFrom:
    - extract:
        key: monitoring/alertmanager
