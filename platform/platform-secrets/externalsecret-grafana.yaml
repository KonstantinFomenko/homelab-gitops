# Grafana's settings from Vault platform/monitoring, synced once (CreatedOnce): a sealed Vault never
# turns them Degraded. Changing a value: vault kv patch, then delete the Secret — ESO recreates it —
# and restart Grafana (README, Secrets of the showcase).
#
# grafana-server: GF_SERVER_ROOT_URL — the full tailnet address of Grafana stays out of git.
# Grafana reads it as an optional envFrom Secret (kube-prometheus-stack values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-server
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: grafana-server
  data:
    - secretKey: GF_SERVER_ROOT_URL
      remoteRef:
        key: monitoring
        property: grafana-root-url
---
# grafana-admin: the admin login (admin.existingSecret in kube-prometheus-stack values).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshPolicy: CreatedOnce
  secretStoreRef:
    kind: SecretStore
    name: vault
  target:
    name: grafana-admin
  data:
    - secretKey: admin-user
      remoteRef:
        key: monitoring
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: monitoring
        property: admin-password
